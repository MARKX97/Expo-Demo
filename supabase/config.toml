project_id = "expo-demo"

[auth]
site_url = "http://localhost:3000"
additional_redirect_urls = ["elevatorhandoff://reset-password"]
enable_signup = false
minimum_password_length = 8

[auth.email]
enable_confirmations = true
max_frequency = "1m0s"
otp_length = 8

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[db.seed]
enabled = false

name: Device E2E

on:
  workflow_dispatch:
    inputs:
      android_build_url:
        description: EAS Android APK artifact URL
        required: true
        type: string
      ios_build_url:
        description: EAS iOS Simulator archive URL
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: device-e2e
  cancel-in-progress: false

env:
  MAESTRO_VERSION: 2.4.0
  MAESTRO_CLI_NO_ANALYTICS: 1

jobs:
  android:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Load masked E2E environment
        env:
          E2E_ENV_B64: ${{ secrets.E2E_ENV_B64 }}
        run: |
          test -n "$E2E_ENV_B64"
          printf '%s' "$E2E_ENV_B64" | base64 --decode > "$RUNNER_TEMP/e2e.env"
          while IFS='=' read -r key value; do
            case "$key" in
              E2E_*|MAESTRO_*) ;;
              *) echo "Unexpected E2E variable name"; exit 1 ;;
            esac
            test -n "$value"
            echo "::add-mask::$value"
            echo "$key=$value" >> "$GITHUB_ENV"
          done < "$RUNNER_TEMP/e2e.env"
          test "$(wc -l < "$RUNNER_TEMP/e2e.env" | tr -d ' ')" = "12"

      - name: Install verified Maestro CLI
        run: |
          curl --fail --location --retry 3 \
            "https://github.com/mobile-dev-inc/Maestro/releases/download/cli-${MAESTRO_VERSION}/maestro.zip" \
            --output "$RUNNER_TEMP/maestro.zip"
          curl --fail --location --retry 3 \
            "https://github.com/mobile-dev-inc/Maestro/releases/download/cli-${MAESTRO_VERSION}/checksums_sha256.txt" \
            --output "$RUNNER_TEMP/maestro-checksums.txt"
          expected="$(awk '$2 == "maestro.zip" { print $1 }' "$RUNNER_TEMP/maestro-checksums.txt")"
          actual="$(shasum -a 256 "$RUNNER_TEMP/maestro.zip" | awk '{ print $1 }')"
          test -n "$expected"
          test "$actual" = "$expected"
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$RUNNER_TEMP/maestro"
          maestro_bin="$(find "$RUNNER_TEMP/maestro" -type f -path '*/bin/maestro' -print -quit)"
          test -n "$maestro_bin"
          chmod +x "$maestro_bin"
          echo "$(dirname "$maestro_bin")" >> "$GITHUB_PATH"

      - name: Download Android APK
        env:
          BUILD_URL: ${{ inputs.android_build_url }}
        run: |
          curl --fail --location --retry 3 "$BUILD_URL" --output "$RUNNER_TEMP/app.apk"
          unzip -t "$RUNNER_TEMP/app.apk" >/dev/null

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android Maestro
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_7
          script: |
            adb install -r "$RUNNER_TEMP/app.apk"
            node scripts/e2e-test-data.mjs prepare
            maestro test \
              --format junit \
              --output output/maestro-android.xml \
              --test-output-dir output/maestro-android \
              .maestro/flows/smoke-login.yml \
              .maestro/flows/critical-journey.yml \
              .maestro/flows/expired-reset-link.yml

      - name: Clean Android E2E data
        if: always()
        run: node scripts/e2e-test-data.mjs cleanup

      - name: Upload Android Maestro evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-android
          path: output/
          if-no-files-found: warn

  ios:
    needs: android
    if: always() && github.ref == 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Load masked E2E environment
        env:
          E2E_ENV_B64: ${{ secrets.E2E_ENV_B64 }}
        run: |
          test -n "$E2E_ENV_B64"
          printf '%s' "$E2E_ENV_B64" | base64 --decode > "$RUNNER_TEMP/e2e.env"
          while IFS='=' read -r key value; do
            case "$key" in
              E2E_*|MAESTRO_*) ;;
              *) echo "Unexpected E2E variable name"; exit 1 ;;
            esac
            test -n "$value"
            echo "::add-mask::$value"
            echo "$key=$value" >> "$GITHUB_ENV"
          done < "$RUNNER_TEMP/e2e.env"
          test "$(wc -l < "$RUNNER_TEMP/e2e.env" | tr -d ' ')" = "12"

      - name: Install verified Maestro CLI
        run: |
          curl --fail --location --retry 3 \
            "https://github.com/mobile-dev-inc/Maestro/releases/download/cli-${MAESTRO_VERSION}/maestro.zip" \
            --output "$RUNNER_TEMP/maestro.zip"
          curl --fail --location --retry 3 \
            "https://github.com/mobile-dev-inc/Maestro/releases/download/cli-${MAESTRO_VERSION}/checksums_sha256.txt" \
            --output "$RUNNER_TEMP/maestro-checksums.txt"
          expected="$(awk '$2 == "maestro.zip" { print $1 }' "$RUNNER_TEMP/maestro-checksums.txt")"
          actual="$(shasum -a 256 "$RUNNER_TEMP/maestro.zip" | awk '{ print $1 }')"
          test -n "$expected"
          test "$actual" = "$expected"
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$RUNNER_TEMP/maestro"
          maestro_bin="$(find "$RUNNER_TEMP/maestro" -type f -path '*/bin/maestro' -print -quit)"
          test -n "$maestro_bin"
          chmod +x "$maestro_bin"
          echo "$(dirname "$maestro_bin")" >> "$GITHUB_PATH"

      - name: Download iOS Simulator app
        env:
          BUILD_URL: ${{ inputs.ios_build_url }}
        run: |
          mkdir -p "$RUNNER_TEMP/ios-app"
          curl --fail --location --retry 3 "$BUILD_URL" --output "$RUNNER_TEMP/app.tar.gz"
          tar -xzf "$RUNNER_TEMP/app.tar.gz" -C "$RUNNER_TEMP/ios-app"
          app_path="$(find "$RUNNER_TEMP/ios-app" -type d -name '*.app' -print -quit)"
          test -n "$app_path"
          echo "IOS_APP_PATH=$app_path" >> "$GITHUB_ENV"

      - name: Boot iOS Simulator and install app
        run: |
          device_id="$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          for devices in data["devices"].values():
              for device in devices:
                  if device["name"].startswith("iPhone"):
                      print(device["udid"])
                      raise SystemExit
          raise SystemExit(1)
          ')"
          echo "IOS_DEVICE_ID=$device_id" >> "$GITHUB_ENV"
          xcrun simctl boot "$device_id" || true
          xcrun simctl bootstatus "$device_id" -b
          xcrun simctl install "$device_id" "$IOS_APP_PATH"

      - name: Run iOS Maestro
        run: |
          node scripts/e2e-test-data.mjs prepare
          maestro test \
            --format junit \
            --output output/maestro-ios.xml \
            --test-output-dir output/maestro-ios \
            .maestro/flows/smoke-login.yml \
            .maestro/flows/critical-journey.yml \
            .maestro/flows/expired-reset-link.yml

      - name: Clean iOS E2E data
        if: always()
        run: node scripts/e2e-test-data.mjs cleanup

      - name: Shut down iOS Simulator
        if: always() && env.IOS_DEVICE_ID != ''
        run: xcrun simctl shutdown "$IOS_DEVICE_ID" || true

      - name: Upload iOS Maestro evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-ios
          path: output/
          if-no-files-found: warn

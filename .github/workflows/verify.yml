name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: supabase/setup-cli@v2
        with:
          version: 2.109.1
          github-token: ${{ github.token }}

      - run: pnpm install --frozen-lockfile

      - name: Start and reset local Supabase
        run: |
          supabase start
          supabase db reset

      - name: Verify generated database types
        run: |
          pnpm run types:generate
          if ! git diff --quiet -- src/types/database.generated.ts; then
            type_diff="$(git diff -- src/types/database.generated.ts)"
            type_diff="${type_diff//'%'/'%25'}"
            type_diff="${type_diff//$'\r'/'%0D'}"
            type_diff="${type_diff//$'\n'/'%0A'}"
            echo "::error file=src/types/database.generated.ts::$type_diff"
            exit 1
          fi

      - name: Export local Supabase test variables
        run: |
          eval "$(supabase status -o env \
            --override-name api.url=TEST_SUPABASE_URL \
            --override-name auth.anon_key=TEST_SUPABASE_PUBLISHABLE_KEY \
            --override-name auth.service_role_key=TEST_SUPABASE_SECRET_KEY)"
          {
            echo "TEST_SUPABASE_URL=$TEST_SUPABASE_URL"
            echo "TEST_SUPABASE_PUBLISHABLE_KEY=$TEST_SUPABASE_PUBLISHABLE_KEY"
            echo "TEST_SUPABASE_SECRET_KEY=$TEST_SUPABASE_SECRET_KEY"
            echo "TEST_MAILPIT_URL=http://127.0.0.1:54324"
          } >> "$GITHUB_ENV"

      - name: Verify documentation
        run: pnpm run verify:docs

      - name: Verify Expo dependencies
        run: pnpm exec expo-doctor

      - name: Verify TypeScript, lint and Jest
        run: pnpm run verify:fast

      - name: Verify database
        run: pnpm run test:db

      - name: Verify low-privilege integration
        run: pnpm run test:integration

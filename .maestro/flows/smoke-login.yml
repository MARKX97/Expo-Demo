appId: com.markx97.elevatorhandoff
name: Supervisor login smoke
---
- launchApp:
    clearState: true
    clearKeychain: true
- runFlow:
    file: ../shared/login.yml
    env:
      EMAIL: ${MAESTRO_SUPERVISOR_EMAIL}
      PASSWORD: ${MAESTRO_SUPERVISOR_PASSWORD}
- extendedWaitUntil:
    visible: 工单总览
    timeout: 45000
- assertVisible: 新建
